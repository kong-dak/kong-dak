input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [type] == "kongdak" {
    grok {
      match => { "message" => 
"%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:level}\s+\[%{DATA:thread}\]\s+%{DATA:logger}\s+:\s+%{GREEDYDATA:message}" 
}
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "kongdak-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
