version: '3.8'
services:
  mariadb:
    image: mariadb:latest
    container_name: kongdak-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kongdak
      MYSQL_USER: kongdak_user
      MYSQL_PASSWORD: kongdak_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - kongdak-network
  redis:
    image: redis:alpine
    container_name: kongdak-redis
    ports:
      - "6379:6379"
    networks:
      - kongdak-network
  prometheus:
    image: prom/prometheus:latest
    container_name: kongdak-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - kongdak-network
  node-exporter:
    image: prom/node-exporter:latest
    container_name: kongdak-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - kongdak-network
  grafana:
    image: grafana/grafana:latest
    container_name: kongdak-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - kongdak-network
    depends_on:
      - prometheus
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: kongdak-backend
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
      - redis
      - prometheus
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/kongdak?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: kongdak_user
      SPRING_DATASOURCE_PASSWORD: kongdak_password
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    networks:
      - kongdak-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kongdak-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - kongdak-network
networks:
  kongdak-network:
    driver: bridge
volumes:
  mariadb-data:
  prometheus-data:
  grafana-data:
