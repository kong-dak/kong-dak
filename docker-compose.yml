version: '3.8'
services:
  mariadb:
    image: mariadb:latest
    container_name: kongdak-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kongdak
      MYSQL_USER: kongdak_user
      MYSQL_PASSWORD: kongdak_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - kongdak-network

  redis:
    image: redis:alpine
    container_name: kongdak-redis
    ports:
      - "6379:6379"
    networks:
      - kongdak-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: kongdak-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - kongdak-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.1
    container_name: kongdak-logstash
    volumes:
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    networks:
      - kongdak-network
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    container_name: kongdak-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - kongdak-network
    depends_on:
      - elasticsearch

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: kongdak-backend
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
      - redis
      - logstash
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/kongdak?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: kongdak_user
      SPRING_DATASOURCE_PASSWORD: kongdak_password
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    networks:
      - kongdak-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kongdak-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - kongdak-network

networks:
  kongdak-network:
    driver: bridge

volumes:
  mariadb-data:
  elasticsearch-data:
